---
layout: default
---

<style>
  .custom-summary::marker,
  .custom-summary::-webkit-details-marker {
    display: none;
  }
  .custom-summary {
    list-style: none; /* Safari 등에서 마커를 숨기기 위해 추가 */
  }
</style>

<div class="card mb-3">
  <div class="card-body">
    <details open>
      <summary
        class="custom-summary d-flex justify-content-between align-items-center"
        style="cursor: pointer"
      >
        <h5 class="card-title mb-0">TO-DOs</h5>

        <small class="text-muted">(펼치기/접기)</small>
      </summary>

      <div class="mt-3">
        {% capture study_list %} {% include study-plan.md %} {% endcapture %} {{
        study-list | markdownify }}
      </div>
    </details>
  </div>
</div>
